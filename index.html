<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- === GOOGLE SEO METADATA === -->
    <title>Chan Sensamnang | IT Manager & Senior IT Lecturer</title>
    <meta name="description" content="Official professional portfolio of Chan Sensamnang, IT Manager and Senior IT Lecturer with over 15 years of expert experience in Enterprise Network Infrastructure, Firewall Security Architecture, and Cybersecurity frameworks.">
    <meta name="keywords" content="Chan Sensamnang, ចាន់ សែនសំណាង, IT Manager, IT Lecturer, Bachelor in IT, Master in IT, MikroTik RouterOS, Network Security, Cybersecurity, Cambodia, IT Expert since 2010">
    <meta name="author" content="Chan Sensamnang">

    <!-- Open Graph / Social Media Share Tags (Facebook / Telegram) -->
    <meta property="og:title" content="Chan Sensamnang | IT Manager & Senior IT Lecturer">
    <meta property="og:description" content="Official executive profile of Chan Sensamnang, IT Manager & Senior IT Lecturer. Expert in Network Infrastructure & Cybersecurity.">
    <meta property="og:type" content="profile">
    <meta property="og:url" content="https://github.io">

    <style>
        :root {
            --mindset-black: #111111;
            --mindset-dark: #1a1a1a;
            --mindset-gold: #f59e0b;
            --text-white: #ffffff;
            --text-muted: #a3a3a3;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--mindset-black);
            color: var(--text-white);
            line-height: 1.6;
        }

        /* 1. MINIMAL TOP NAVIGATION BAR */
        .mindset-navbar {
            background-color: var(--mindset-black);
            padding: 30px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .mindset-logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: 2px;
            text-decoration: none;
            text-transform: uppercase;
        }

        .mindset-logo span {
            color: var(--mindset-gold);
        }

        .nav-cta-btn {
            background-color: var(--mindset-gold);
            color: var(--mindset-black);
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
            transition: background-color 0.2s ease;
        }

        .nav-cta-btn:hover {
            background-color: #d97706;
        }

        /* 2. TRANSFORM MINDSET HERO SECTION */
        .mindset-hero {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .hero-left {
            padding-right: 10px;
        }

        .mindset-tagline {
            color: var(--mindset-gold);
            font-size: 0.95rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 15px;
        }

        .mindset-heading {
            font-size: 3.5rem;
            font-weight: 900;
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 30px;
            letter-spacing: -1px;
        }

        .mindset-heading span {
            color: var(--mindset-gold);
        }

        .bio-box-en {
            font-size: 1.05rem;
            color: var(--text-white);
            margin-bottom: 25px;
            text-align: justify;
            font-weight: 400;
            line-height: 1.7;
        }

        .bio-box-kh {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 40px;
            text-align: justify;
            line-height: 1.8;
        }

        /* PHOTO FRAME UI (UX PERFECTLY BALANCED) */
        .hero-right {
            display: flex;
            justify-content: center;
        }

        .photo-container {
            width: 100%;
            max-width: 350px;
            background-color: var(--mindset-dark);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 15px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            position: relative;
        }

        .photo-container::after {
            content: '';
            position: absolute;
            bottom: -15px;
            left: -15px;
            width: 100%;
            height: 100%;
            border: 2px solid var(--mindset-gold);
            z-index: -1;
        }

        .photo-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background-color: #000000;
        }

        .photo-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 3. CORE EXPERTISE CARDS GRID */
        .competence-section {
            background-color: var(--mindset-dark);
            padding: 80px 0;
            margin-top: 40px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .section-heading-block {
            margin-bottom: 50px;
        }

        .section-title-en {
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .section-title-kh {
            font-size: 1.3rem;
            color: var(--mindset-gold);
            margin-top: 5px;
            font-weight: 500;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 30px;
        }

        .mindset-card {
            background-color: var(--mindset-black);
            padding: 35px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            transition: border-color 0.25s ease;
        }

        .mindset-card:hover {
            border-color: var(--mindset-gold);
        }

        .card-num {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--mindset-gold);
            margin-bottom: 20px;
            font-family: monospace;
        }

        .card-head-en {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .card-head-kh {
            font-size: 1rem;
            color: var(--mindset-gold);
            margin-bottom: 15px;
        }

        .card-p-en {
            font-size: 0.95rem;
            color: #ffffff;
            text-align: justify;
            margin-bottom: 10px;
        }

        .card-p-kh {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: justify;
        }

        /* 4. CHRONOLOGICAL DATA TIMELINE */
        .resume-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
        }

        .resume-column-title {
            font-size: 1.8rem;
            font-weight: 900;
            text-transform: uppercase;
            margin-bottom: 35px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 10px;
        }

        .resume-item {
            margin-bottom: 35px;
            position: relative;
        }

        .date-badge {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--mindset-gold);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .item-main-title {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
        }

        .item-sub-title {
            font-size: 0.95rem;
            color: var(--mindset-gold);
            margin-bottom: 12px;
        }

        .item-p-en {
            font-size: 0.95rem;
            color: #ffffff;
            text-align: justify;
            margin-bottom: 8px;
        }

        .item-p-kh {
            font-size: 0.9rem;
            color: var(--text-muted);
            text-align: justify;
        }

        footer {
            background-color: #000000;
            color: var(--text-muted);
            text-align: center;
            padding: 40px 20px;
            font-size: 0.85rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            letter-spacing: 1px;
        }

        /* RESPONSIVE LAYOUT SYSTEM */
        @media (max-width: 1024px) {
            .mindset-navbar { padding: 20px; flex-direction: column; gap: 15px; }
            .mindset-hero { grid-template-columns: 1fr; text-align: center; margin: 30px auto; }
            .hero-left { padding-right: 0; }
            .bio-box-en, .bio-box-kh { text-align: center; }
            .hero-right { grid-row: 1; }
            .cards-grid { grid-template-columns: 1fr; }
            .resume-section { grid-template-columns: 1fr; gap: 40px; }
            .mindset-heading { font-size: 2.5rem; }
        }
    </style>
</head>
<body>

    <nav class="mindset-navbar">
        <a href="#" class="mindset-logo">Chan <span>Sensamnang</span></a>
        <a href="https://t.me" class="nav-cta-btn" target="_blank">Contact Me</a>
    </nav>
