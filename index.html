<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
            --nh-black: #0b0f19;       /* Namhay Deep Black Background */
            --nh-dark: #111827;        /* Namhay Dark Gray Block Content */
            --nh-gold: #f59e0b;        /* Namhay Vibrant Gold Accent */
            --text-white: #ffffff;
            --text-gray: #94a3b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--nh-black);
            color: var(--text-white);
            line-height: 1.6;
        }

        /* 1. TOP NAVIGATION BAR */
        .nh-navbar {
            background-color: rgba(11, 15, 25, 0.9);
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nh-logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-white);
            letter-spacing: 1px;
            text-decoration: none;
        }

        .nh-logo span {
            color: var(--nh-gold);
        }

        .nh-nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
            align-items: center;
        }

        .nh-nav-links a {
            text-decoration: none;
            color: var(--text-gray);
            font-weight: 500;
            font-size: 0.95rem;
            text-transform: capitalize;
            transition: color 0.2s ease;
        }

        .nh-nav-links a:hover {
            color: var(--text-white);
        }

        .btn-hire-me {
            background-color: var(--nh-gold);
            color: var(--nh-black) !important;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700 !important;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        .btn-hire-me:hover {
            background-color: #d97706;
            transform: translateY(-2px);
        }

        /* 2. SPLIT HERO LAYOUT CONTAINER */
        .nh-hero-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 40px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 60px;
            align-items: center;
        }

        .hero-left-details {
            padding-right: 20px;
        }

        .hero-welcome-tag {
            color: var(--nh-gold);
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .hero-name-heading {
            font-size: 3.5rem;
            font-weight: 800;
            line-height: 1.15;
            margin-bottom: 15px;
            letter-spacing: -1px;
        }

        .hero-role-heading {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--nh-gold);
            margin-bottom: 25px;
            line-height: 1.4;
        }

        .hero-bio-p {
            font-size: 1.05rem;
            color: var(--text-gray);
            margin-bottom: 25px;
            text-align: justify;
            line-height: 1.7;
        }

        .hero-bio-kh {
            font-size: 1rem;
            color: #cbd5e1;
            margin-bottom: 40px;
            text-align: justify;
            line-height: 1.8;
            border-left: 3px solid var(--nh-gold);
            padding-left: 15px;
        }

        /* ACTIONS BUTTONS UX BLOCK */
        .hero-actions-wrap {
            display: flex;
            gap: 20px;
        }

        .btn-nh-primary {
            display: inline-block;
            background-color: var(--nh-gold);
            color: var(--nh-black);
            padding: 14px 32px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 6px;
            transition: all 0.25s ease;
        }

        .btn-nh-primary:hover {
            background-color: #d97706;
            transform: translateY(-3px);
        }

        /* PROPORTION-CONTROLLED IMAGE BLOCK */
        .hero-right-photo-wrap {
            display: flex;
            justify-content: center;
        }

        .nh-photo-frame {
            width: 100%;
            max-width: 350px;
            background-color: var(--nh-dark);
            border-radius: 20px;
            padding: 15px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease;
        }

        .nh-photo-frame:hover {
            transform: scale(1.02);
        }

        .inner-img-box {
            width: 100%;
            aspect-ratio: 1 / 1;
            border-radius: 12px;
            overflow: hidden;
            background-color: var(--nh-black);
        }

        .inner-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* 3. MODULAR GRID SECTIONS */
        .nh-experience-section {
            background-color: var(--nh-dark);
            padding: 80px 0;
            margin-top: 60px;
            border-top: 1px solid rgba(255, 255, 255, 0.03);
        }

        .section-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 40px;
        }

        .block-main-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 40px;
            letter-spacing: -0.5px;
            border-left: 4px solid var(--nh-gold);
            padding-left: 15px;
        }

        .grid-split-blocks {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .info-category-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--nh-gold);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .nh-data-card {
            background-color: var(--nh-black);
            padding: 25px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            margin-bottom: 20px;
            transition: transform 0.2s ease;
        }

        .nh-data-card:hover {
            transform: translateX(5px);
        }

        .card-time-badge {
            display: inline-block;
            color: var(--nh-gold);
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .card-main-title {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-white);
            margin-bottom: 4px;
        }

        .card-sub-title {
            font-size: 0.95rem;
            color: var(--nh-gold);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .card-description-p {
            font-size: 0.92rem;
            color: var(--text-gray);
            text-align: justify;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .card-description-kh {
            font-size: 0.9rem;
            color: #cbd5e1;
            text-align: justify;
            line-height: 1.7;
            border-top: 1px dashed rgba(255,255,255,0.08);
            padding-top: 10px;
            margin-top: 10px;
        }

        /* GLOBAL FOOTER ARCHITECTURE */
        footer {
            background-color: var(--nh-black);
            color: var(--text-gray);
            text-align: center;
            padding: 40px 20px;
            font-size: 0.9rem;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 60px;
            letter-spacing: 0.5px;
        }

        /* RESPONSIVE LAYOUT BREAKPOINTS */
        @media (max-width: 1024px) {
            .nh-navbar { padding: 20px 5%; flex-direction: column; gap: 15px; }
            .nh-hero-section { grid-template-columns: 1fr; text-align: center; margin: 30px auto; }
            .hero-left-details { padding-right: 0; }
            .hero-bio-p, .hero-bio-kh { text-align: center; }
            .hero-bio-kh { border-left: none; padding-left: 0; }
            .hero-actions-wrap { justify-content: center; }
            .hero-right-photo-wrap { grid-row: 1; }
            .grid-split-blocks { grid-template-columns: 1fr; }
            .hero-name-heading { font-size: 2.8rem; }
        }
