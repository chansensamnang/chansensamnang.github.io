<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chan Sensamnang | IT Manager & Senior IT Lecturer</title>
    
    <!-- Google Fonts & FontAwesome Icons -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cloudflare.com">

    <style>
        :root {
            --smm-blue: #1e3a8a;       /* Deep Trust Blue */
            --smm-amber: #f59e0b;      /* SMM Vibrant Amber/Yellow */
            --smm-bg: #ffffff;          /* Clean White Base */
            --smm-gray: #f8fafc;        /* Slate 50 Light Gray Block */
            --text-dark: #0f172a;       /* Slate 900 */
            --text-muted: #475569;      /* Slate 600 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Montserrat', 'Kantumruy Pro', sans-serif;
            background-color: var(--smm-bg);
            color: var(--text-dark);
            line-height: 1.6;
        }

        /* SMM AGENCY NAVIGATION BAR */
        .smm-navbar {
            background-color: #ffffff;
            padding: 25px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #e2e8f0;
        }

        .smm-logo {
            font-size: 1.4rem;
            font-weight: 800;
            color: var(--smm-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-decoration: none;
        }

        .smm-logo span {
            color: var(--smm-amber);
        }

        .smm-nav-links {
            display: flex;
            gap: 35px;
            list-style: none;
        }

        .smm-nav-links a {
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            transition: color 0.2s ease;
        }

        .smm-nav-links a:hover {
            color: var(--smm-amber);
        }

        /* HERO LAYOUT GRIDS (NICEPAGE CONCEPT) */
        .smm-hero-section {
            max-width: 1200px;
            margin: 60px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 50px;
            align-items: center;
        }

        /* LEFT AREA: STRATEGIC HEADINGS */
        .hero-left-block {
            padding-right: 10px;
        }

        .agency-badge {
            display: inline-block;
            background-color: #fef3c7;
            color: #d97706;
            padding: 6px 16px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-radius: 4px;
            margin-bottom: 20px;
        }

        .hero-title {
            font-size: 3.2rem;
            font-weight: 800;
            line-height: 1.15;
            color: var(--smm-blue);
            margin-bottom: 25px;
            letter-spacing: -1px;
        }

        .hero-title span {
            color: var(--smm-amber);
        }

        .executive-summary {
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            text-align: justify;
            font-weight: 400;
        }

        /* RIGHT AREA: BALANCED PREMIUM IMAGE PROFILE FRAME */
        .hero-right-block {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* UX FIXED: រៀបចំទំហំរូបភាពឱ្យល្មមស្អាត មិនធំពេកទេ */
        .smm-photo-frame {
            width: 100%;
            max-width: 360px; /* Constrained for perfect proportion */
            background-color: #ffffff;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
            border: 1px solid #f1f5f9;
            position: relative;
        }

        /* Decorative background element behind photo */
        .smm-photo-frame::before {
            content: '';
            position: absolute;
            top: -15px;
            right: -15px;
            width: 100px;
            height: 100px;
            background-color: #fde68a;
            border-radius: 12px;
            z-index: -1;
        }

        .image-wrapper {
            width: 100%;
            aspect-ratio: 1 / 1; /* Retains clean square format */
            border-radius: 10px;
            overflow: hidden;
            background-color: var(--smm-gray);
        }

        .image-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* MODULAR CORE COMPETENCIES GRID */
        .competencies-section {
            background-color: var(--smm-gray);
            padding: 70px 0;
            margin-top: 40px;
        }

        .inner-wrapper {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 30px;
        }

        .section-title {
            font-size: 1.8rem;
            font-weight: 800;
            text-transform: uppercase;
            color: var(--smm-blue);
            margin-bottom: 35px;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .competencies-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .smm-card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
            transition: transform 0.25s ease;
        }

        .smm-card:hover {
            transform: translateY(-5px);
        }

        .card-icon {
            width: 50px;
            height: 50px;
            background-color: #eff6ff;
            color: var(--smm-blue);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .smm-card h4 {
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 10px;
        }

        .smm-card p {
            font-size: 0.95rem;
            color: var(--text-muted);
            text-align: justify;
        }

        /* CHRONOLOGICAL EXPERIENCE AREA */
        .timeline-section {
            max-width: 1200px;
            margin: 80px auto;
            padding: 0 30px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
        }

        .timeline-column h3 {
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--smm-blue);
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .timeline-item {
            background-color: #ffffff;
            padding: 24px;
            border-radius: 8px;
            border-left: 4px solid var(--smm-amber);
            box-shadow: 0 4px 15px rgba(0,0,0,0.01);
            margin-bottom: 20px;
            border: 1px solid #f1f5f9;
            border-left-width: 4px;
        }

        .item-date {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--smm-amber);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .item-sub {
            font-size: 0.9rem;
            color: var(--smm-blue);
            font-weight: 600;
            margin-bottom: 10px;
        }

        .item-desc {
            font-size: 0.92rem;
            color: var(--text-muted);
            text-align: justify;
        }

        /* PREMIUM SMM CALL TO ACTION BUTTON */
        .smm-cta-wrap {
            text-align: center;
            margin-top: 50px;
            padding-bottom: 20px;
        }

        .btn-smm-tg {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background-color: var(--smm-blue);
            color: #ffffff;
            padding: 15px 35px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.95rem;
            border-radius: 50px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 25px rgba(30, 58, 138, 0.2);
            transition: all 0.25s ease;
        }

        .btn-smm-tg:hover {
            background-color: var(--smm-amber);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.25);
            transform: translateY(-2px);
        }

        /* GLOBAL FOOTER FRAME */
        footer {
            background-color: var(--text-dark);
            color: #94a3b8;
            text-align: center;
            padding: 40px 20px;
            font-size: 0.85rem;
            margin-top: 80px;
            letter-spacing: 0.5px;
        }

        /* WEB LAYOUT RESPONSIVE ADAPTABILITY */
        @media (max-width: 1024px) {
            .smm-hero-section { grid-template-columns: 1fr; text-align: center; margin: 30px auto; }
            .hero-left-block { padding-right: 0; }
            .executive-summary { text-align: center; }
            .hero-right-block { grid-row: 1; }
            .competencies-grid { grid-template-columns: 1fr; }
            .timeline-section { grid-template-columns: 1fr; gap: 40px; }
            .hero-title { font-size: 2.5rem; }
        }
    </style>
</head>
<body>
